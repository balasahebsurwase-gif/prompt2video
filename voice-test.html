<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt2Video Voice Test</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111827;
color:white;
padding:30px;
max-width:700px;
margin:auto;
}

textarea{
width:100%;
height:150px;
padding:15px;
box-sizing:border-box;
font-size:17px;
border-radius:10px;
}

select,button{
width:100%;
padding:15px;
margin-top:12px;
font-size:16px;
border-radius:10px;
}

button{
background:white;
color:#111;
font-weight:bold;
border:0;
}

#status{
margin-top:20px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>🎙️ Prompt2Video Voice Test</h1>

<p>Test your video voice-over.</p>

<textarea id="text">नमस्कार! सुवर्ण बुटिक्समध्ये तुमच्यासाठी नवीन आणि आकर्षक कलेक्शन आले आहे. आजच भेट द्या!</textarea>

<select id="language">

<option value="mr-IN">
Marathi
</option>

<option value="hi-IN">
Hindi
</option>

<option value="en-IN">
English
</option>

</select>

<button onclick="speak()">
🎙️ PLAY VOICE
</button>

<button onclick="stopVoice()">
⏹️ STOP
</button>

<div id="status"></div>

<script>

function speak(){

const text=document.getElementById("text").value;

const language=document.getElementById("language").value;

const status=document.getElementById("status");

if(!text){

status.innerText="Please enter text.";

return;

}

if(!("speechSynthesis" in window)){

status.innerText="❌ Voice is not supported by this browser.";

return;

}

speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance(text);

speech.lang=language;

speech.rate=0.95;

speech.pitch=1;

speech.volume=1;

speech.onstart=function(){

status.innerText="🔊 Voice is playing...";

};

speech.onend=function(){

status.innerText="✅ Voice finished.";

};

speech.onerror=function(){

status.innerText="❌ Voice could not be played.";

};

speechSynthesis.speak(speech);

}

function stopVoice(){

speechSynthesis.cancel();

document.getElementById("status").innerText="Voice stopped.";

}

</script>

</body>
</html>
