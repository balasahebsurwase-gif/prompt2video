<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Prompt2Video - AI Image Test</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
}

.container{
max-width:700px;
margin:auto;
padding:25px 18px 50px;
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#aeb7ca;
margin-bottom:25px;
}

.card{
background:#151c30;
border:1px solid #2b3653;
border-radius:18px;
padding:20px;
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:7px;
}

input,
textarea{
width:100%;
box-sizing:border-box;
padding:14px;
border-radius:10px;
border:1px solid #3b465f;
background:#0d1324;
color:white;
font-size:16px;
}

textarea{
height:150px;
resize:vertical;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:0;
border-radius:10px;
background:white;
color:#111827;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

.warning{
background:#302514;
border:1px solid #66502a;
padding:14px;
border-radius:10px;
margin-top:15px;
color:#f4d58b;
font-size:14px;
line-height:1.5;
}

#status{
margin-top:18px;
color:#cbd5e1;
line-height:1.5;
}

#result{
margin-top:20px;
display:none;
}

#result img{
width:100%;
display:block;
border-radius:15px;
}

.download{
display:block;
margin-top:12px;
padding:14px;
background:white;
color:#111827;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🖼️ AI Image Generator</h1>

<div class="subtitle">
Prompt2Video — Stage 4D
</div>

<div class="card">

<label>
🔑 Hugging Face Access Token
</label>

<input
id="token"
type="password"
placeholder="Paste your HF token here"
autocomplete="off"
>

<div class="warning">

⚠️ TEMPORARY TEST ONLY

Do NOT save this token in GitHub code.

Do NOT put the token into index.html,
director.html, images.html, or any other file.

We are only entering it temporarily in this browser test.

</div>

<label>
📝 Image Prompt
</label>

<textarea id="prompt">Photorealistic cinematic advertisement scene, a beautiful young Indian woman entering a premium modern Indian clothing boutique, colourful sarees and fashionable dresses displayed throughout the store, elegant realistic Indian interior, warm luxury lighting, natural happy expression, realistic hands and natural body proportions, professional commercial photography, cinematic depth of field, highly detailed, sharp focus, realistic skin texture, vertical composition.</textarea>

<button
id="generateButton"
onclick="generateImage()">

✨ GENERATE AI IMAGE

</button>

<div id="status">
Waiting for your prompt.
</div>

<div id="result">

<img id="generatedImage">

<a
id="download"
class="download"
download="prompt2video-scene1.png">

⬇️ DOWNLOAD IMAGE

</a>

</div>

</div>

</div>

<script type="module">

import {
InferenceClient
}
from
"https://esm.sh/@huggingface/inference";

window.generateImage=async function(){

const token=
document.getElementById("token").value.trim();

const prompt=
document.getElementById("prompt").value.trim();

const button=
document.getElementById("generateButton");

const status=
document.getElementById("status");

const result=
document.getElementById("result");

const image=
document.getElementById("generatedImage");

const download=
document.getElementById("download");

if(!token){

alert("Please enter your Hugging Face access token.");

return;

}

if(!prompt){

alert("Please enter an image prompt.");

return;

}

button.disabled=true;

result.style.display="none";

status.innerText=
"🧠 Connecting to Hugging Face...";

try{

const hf=
new InferenceClient(token);

status.innerText=
"🎨 Generating your AI image...";

const blob=
await hf.textToImage({

model:
"black-forest-labs/FLUX.1-schnell",

provider:
"auto",

inputs:
prompt

});

const imageUrl=
URL.createObjectURL(blob);

image.src=imageUrl;

download.href=imageUrl;

result.style.display="block";

status.innerText=
"✅ AI image generated successfully!";

}catch(error){

console.error(error);

status.innerText=
"❌ Image generation failed: "
+
(error.message || "Unknown error");

}finally{

button.disabled=false;

}

};

</script>

</body>

</html>
