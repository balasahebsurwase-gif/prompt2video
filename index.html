<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt2Video</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#10131a;
color:white;
}

.container{
max-width:650px;
margin:auto;
padding:20px;
}

h1{
font-size:34px;
}

p{
color:#aeb5c2;
}

.card{
background:#191e27;
padding:20px;
border-radius:18px;
}

textarea{
width:100%;
height:130px;
padding:14px;
box-sizing:border-box;
border-radius:10px;
border:1px solid #444;
background:#11151c;
color:white;
font-size:16px;
}

select,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:16px;
}

select{
background:#11151c;
color:white;
border:1px solid #444;
}

button{
border:0;
background:white;
color:#111;
font-weight:bold;
}

button:disabled{
opacity:.5;
}

#status{
margin-top:15px;
font-weight:bold;
}

#progress{
display:none;
height:8px;
background:#333;
border-radius:10px;
margin-top:15px;
}

#bar{
height:100%;
width:0%;
background:white;
border-radius:10px;
}

video{
display:none;
width:100%;
margin-top:20px;
border-radius:15px;
background:black;
}

#download{
display:none;
margin-top:12px;
padding:14px;
background:white;
color:#111;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Prompt2Video</h1>

<p>
Create a cinematic 15-second video from your idea.
</p>

<div class="card">

<b>Your video idea</b>

<textarea id="prompt"
placeholder="Example: Create a Marathi clothing shop advertisement"></textarea>

<select id="language">
<option>Marathi</option>
<option>English</option>
<option>Hindi</option>
</select>

<button id="createButton" onclick="makeVideo()">
🎬 CREATE VIDEO
</button>

<div id="progress">
<div id="bar"></div>
</div>

<div id="status"></div>

<video id="video" controls playsinline></video>

<a id="download">⬇️ DOWNLOAD VIDEO</a>

</div>
</div>

<script>

function makeVideo(){

const prompt=document.getElementById("prompt").value.trim();

if(!prompt){
alert("Please enter your video idea.");
return;
}

const button=document.getElementById("createButton");
const status=document.getElementById("status");
const progress=document.getElementById("progress");
const bar=document.getElementById("bar");
const video=document.getElementById("video");
const download=document.getElementById("download");

button.disabled=true;
progress.style.display="block";
video.style.display="none";
download.style.display="none";

status.innerText="Preparing video...";

const canvas=document.createElement("canvas");

canvas.width=540;
canvas.height=960;

const ctx=canvas.getContext("2d");

let stream;

try{

stream=canvas.captureStream(24);

}catch(error){

status.innerText="Your browser does not support video recording.";
button.disabled=false;
return;

}

let mimeType="video/webm";

if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8")){
mimeType="video/webm;codecs=vp8";
}

let recorder;

try{

recorder=new MediaRecorder(stream,{
mimeType:mimeType
});

}catch(error){

status.innerText="Video recording is not supported on this browser.";

button.disabled=false;

return;

}

let chunks=[];

recorder.ondataavailable=function(event){

if(event.data && event.data.size>0){

chunks.push(event.data);

}

};

recorder.onerror=function(){

status.innerText="Recording error. Please try again.";

button.disabled=false;

};

recorder.onstop=function(){

try{

const blob=new Blob(chunks,{
type:mimeType
});

if(blob.size===0){

status.innerText="Video was empty. Please try again.";

button.disabled=false;

return;

}

const url=URL.createObjectURL(blob);

video.src=url;

video.style.display="block";

download.href=url;

download.download="Prompt2Video-15sec.webm";

download.style.display="block";

status.innerText="✅ Video created successfully!";

button.disabled=false;

}catch(error){

status.innerText="Could not prepare the video.";

button.disabled=false;

}

};

const startTime=Date.now();

let stopped=false;

function finish(){

if(stopped)return;

stopped=true;

try{

recorder.stop();

}catch(e){}

}

recorder.start(250);

status.innerText="🎬 Recording your video...";

function draw(){

const elapsed=(Date.now()-startTime)/1000;

const percent=Math.min(elapsed/15,1);

bar.style.width=(percent*100)+"%";

drawScene(ctx,canvas,sceneNumber(elapsed),prompt);

if(elapsed>=15){

finish();

return;

}

requestAnimationFrame(draw);

}

/* safety timeout */

setTimeout(function(){

finish();

},18000);

requestAnimationFrame(draw);

}

function sceneNumber(seconds){

if(seconds<3)return 0;

if(seconds<6)return 1;

if(seconds<9)return 2;

if(seconds<12)return 3;

return 4;

}

function drawScene(ctx,canvas,scene,prompt){

const w=canvas.width;
const h=canvas.height;

ctx.clearRect(0,0,w,h);

/* background */

const colors=[
["#182848","#4b6cb7"],
["#42275a","#734b6d"],
["#134e5e","#71b280"],
["#7b4397","#dc2430"],
["#141e30","#243b55"]
];

const gradient=ctx.createLinearGradient(0,0,w,h);

gradient.addColorStop(0,colors[scene][0]);
gradient.addColorStop(1,colors[scene][1]);

ctx.fillStyle=gradient;

ctx.fillRect(0,0,w,h);

/* cinematic glow */

ctx.fillStyle="rgba(255,255,255,.08)";

ctx.beginPath();

ctx.arc(w/2,430,250,0,Math.PI*2);

ctx.fill();

/* location */

drawLocation(ctx,scene,w,h);

/* person */

drawPerson(ctx,w/2,600);

/* title */

ctx.textAlign="center";

ctx.fillStyle="white";

ctx.font="bold 34px Arial";

const titles=[
"DISCOVER",
"ENTER",
"EXPLORE",
"ENJOY",
"YOUR MOMENT"
];

ctx.fillText(titles[scene],w/2,150);

/* prompt */

ctx.font="20px Arial";

let text=prompt;

if(text.length>42){

text=text.substring(0,42)+"...";

}

ctx.fillText(text,w/2,820);

/* footer */

ctx.font="18px Arial";

ctx.fillText("PROMPT2VIDEO • 9:16",w/2,h-45);

}

function drawLocation(ctx,scene,w,h){

/* floor */

ctx.fillStyle="rgba(0,0,0,.25)";

ctx.fillRect(0,690,w,270);

/* windows/buildings */

ctx.fillStyle="rgba(255,255,255,.13)";

for(let x=35;x<w;x+=125){

ctx.fillRect(x,270,85,220);

}

/* shop counter */

ctx.fillStyle="rgba(255,255,255,.15)";

ctx.fillRect(60,520,w-120,100);

/* scene-specific sign */

ctx.fillStyle="rgba(255,255,255,.8)";

ctx.font="bold 22px Arial";

ctx.textAlign="center";

const signs=[
"FASHION BOUTIQUE",
"WELCOME",
"NEW COLLECTION",
"SHOP TODAY",
"THANK YOU"
];

ctx.fillText(signs[scene],w/2,570);

}

function drawPerson(ctx,x,y){

/* head */

ctx.fillStyle="rgba(255,230,210,.95)";

ctx.beginPath();

ctx.arc(x,y-150,48,0,Math.PI*2);

ctx.fill();

/* hair */

ctx.fillStyle="#171717";

ctx.beginPath();

ctx.arc(x,y-175,50,Math.PI,Math.PI*2);

ctx.fill();

/* body */

ctx.fillStyle="rgba(255,255,255,.9)";

ctx.beginPath();

ctx.roundRect(x-65,y-100,130,210,30);

ctx.fill();

/* arms */

ctx.strokeStyle="rgba(255,255,255,.9)";

ctx.lineWidth=24;

ctx.lineCap="round";

ctx.beginPath();

ctx.moveTo(x-50,y-55);

ctx.lineTo(x-110,y+45);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(x+50,y-55);

ctx.lineTo(x+110,y+45);

ctx.stroke();

/* legs */

ctx.beginPath();

ctx.moveTo(x-30,y+105);

ctx.lineTo(x-45,y+220);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(x+30,y+105);

ctx.lineTo(x+45,y+220);

ctx.stroke();

}

</script>

</body>
</html>
