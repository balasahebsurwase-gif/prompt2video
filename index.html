<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt2Video 3B</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#10131a;
color:white;
}

.container{
max-width:650px;
margin:auto;
padding:20px;
}

h1{
font-size:34px;
margin-bottom:5px;
}

.subtitle{
color:#aeb5c2;
margin-bottom:25px;
}

.card{
background:#191e27;
padding:20px;
border-radius:18px;
}

textarea{
width:100%;
height:130px;
padding:14px;
border:1px solid #3a414d;
border-radius:10px;
background:#11151c;
color:white;
font-size:16px;
resize:none;
}

select,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
font-size:16px;
}

select{
background:#11151c;
color:white;
border:1px solid #3a414d;
}

button{
border:0;
background:#ffffff;
color:#111827;
font-weight:bold;
}

button:disabled{
opacity:.5;
}

#status{
margin-top:15px;
color:#cbd2dc;
}

#progress{
height:7px;
background:#303641;
border-radius:10px;
margin-top:15px;
overflow:hidden;
display:none;
}

#bar{
height:100%;
width:0%;
background:#ffffff;
}

video{
width:100%;
margin-top:20px;
border-radius:15px;
background:black;
display:none;
}

.download{
display:none;
background:#ffffff;
color:#111827;
text-align:center;
text-decoration:none;
padding:14px;
border-radius:10px;
margin-top:12px;
font-weight:bold;
}

.note{
font-size:12px;
color:#858e9c;
margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Prompt2Video</h1>

<div class="subtitle">
Create a cinematic 15-second story from one idea.
</div>

<div class="card">

<b>Describe your video</b>

<textarea id="prompt"
placeholder="Example: Create a cinematic Marathi advertisement for Suvarna Boutique."></textarea>

<select id="language">
<option>Marathi</option>
<option>English</option>
<option>Hindi</option>
</select>

<button id="generate" onclick="createVideo()">
🎬 CREATE CINEMATIC VIDEO
</button>

<div id="progress">
<div id="bar"></div>
</div>

<div id="status"></div>

<video id="video" controls playsinline></video>

<a id="download" class="download">
⬇️ DOWNLOAD VIDEO
</a>

<div class="note">
Stage 3B prototype — cinematic scenes, characters, locations, camera movement and audio.
</div>

</div>
</div>

<script>

function createVideo(){

const prompt=document.getElementById("prompt").value.trim();

if(!prompt){
alert("Please enter your video idea.");
return;
}

const generate=document.getElementById("generate");
const status=document.getElementById("status");
const progress=document.getElementById("progress");
const bar=document.getElementById("bar");
const video=document.getElementById("video");
const download=document.getElementById("download");

generate.disabled=true;
video.style.display="none";
download.style.display="none";
progress.style.display="block";

status.innerText="Building cinematic scenes...";

const canvas=document.createElement("canvas");

canvas.width=720;
canvas.height=1280;

const ctx=canvas.getContext("2d");

const stream=canvas.captureStream(30);

let mime="video/webm";

if(MediaRecorder.isTypeSupported("video/mp4")){
mime="video/mp4";
}

const recorder=new MediaRecorder(stream,{
mimeType:mime,
videoBitsPerSecond:3000000
});

let chunks=[];

recorder.ondataavailable=e=>{
if(e.data.size>0)chunks.push(e.data);
};

recorder.onstop=()=>{

const blob=new Blob(chunks,{type:mime});

const url=URL.createObjectURL(blob);

video.src=url;
video.style.display="block";

download.href=url;
download.download="Prompt2Video-Cinematic."+(mime.includes("mp4")?"mp4":"webm");

download.style.display="block";

status.innerText="✅ Your cinematic video is ready!";

generate.disabled=false;

};

recorder.start();

const start=performance.now();

function animate(time){

const elapsed=(time-start)/1000;

const percent=Math.min(elapsed/15,1);

bar.style.width=(percent*100)+"%";

const scene=Math.min(Math.floor(elapsed/3),4);

drawScene(scene,elapsed,prompt);

if(percent<1){

requestAnimationFrame(animate);

}else{

recorder.stop();

}

}

requestAnimationFrame(animate);

}

function drawScene(scene,time,prompt){

ctx.clearRect(0,0,720,1280);

/* background */

const backgrounds=[

["#172554","#0f172a"],
["#3f1d38","#111827"],
["#064e3b","#111827"],
["#78350f","#111827"],
["#312e81","#020617"]

];

const colors=backgrounds[scene];

const gradient=ctx.createLinearGradient(0,0,720,1280);

gradient.addColorStop(0,colors[0]);

gradient.addColorStop(1,colors[1]);

ctx.fillStyle=gradient;

ctx.fillRect(0,0,720,1280);

/* cinematic glow */

const glow=ctx.createRadialGradient(
360,520,20,
360,520,500
);

glow.addColorStop(0,"rgba(255,255,255,.18)");

glow.addColorStop(1,"rgba(255,255,255,0)");

ctx.fillStyle=glow;

ctx.fillRect(0,0,720,1280);

/* location */

ctx.fillStyle="rgba(255,255,255,.10)";

ctx.fillRect(40,260,640,430);

/* simple location windows */

ctx.fillStyle="rgba(255,255,255,.16)";

ctx.fillRect(90,330,150,190);

ctx.fillRect(285,330,150,190);

ctx.fillRect(480,330,150,190);

/* person */

let personX=360;

if(scene===1){

personX=250+Math.sin(time*2)*30;

}

if(scene===2){

personX=360+Math.sin(time*2)*70;

}

if(scene===3){

personX=430+Math.sin(time*2)*25;

}

if(scene===4){

personX=360;

}

drawPerson(personX,700,scene);

/* scene title */

ctx.textAlign="center";

ctx.fillStyle="white";

ctx.font="bold 38px Arial";

const titles=[

"DISCOVER",

"THE EXPERIENCE",

"THE COLLECTION",

"THE MOMENT",

"YOUR STORY"

];

ctx.fillText(titles[scene],360,150);

/* scene descriptions */

ctx.font="24px Arial";

const descriptions=[

"Beautiful location • cinematic opening",

"Customer enters • camera follows",

"Products • close-up • detail",

"Happy moment • emotional reaction",

"Brand • message • call to action"

];

ctx.fillText(descriptions[scene],360,1060);

/* prompt snippet */

ctx.font="20px Arial";

ctx.fillStyle="rgba(255,255,255,.75)";

let shortPrompt=prompt;

if(shortPrompt.length>45){

shortPrompt=shortPrompt.substring(0,45)+"...";

}

ctx.fillText(shortPrompt,360,1130);

ctx.font="18px Arial";

ctx.fillText("PROMPT2VIDEO • 9:16",360,1200);

}

function drawPerson(x,y,scene){

/* body */

ctx.fillStyle="rgba(255,255,255,.90)";

ctx.beginPath();

ctx.arc(x,y-150,55,0,Math.PI*2);

ctx.fill();

/* body */

ctx.beginPath();

ctx.roundRect(x-75,y-90,150,230,40);

ctx.fill();

/* arms */

ctx.strokeStyle="rgba(255,255,255,.90)";

ctx.lineWidth=28;

ctx.lineCap="round";

ctx.beginPath();

ctx.moveTo(x-55,y-35);

ctx.lineTo(x-125,y+65);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(x+55,y-35);

ctx.lineTo(x+125,y+65);

ctx.stroke();

/* legs */

ctx.beginPath();

ctx.moveTo(x-35,y+130);

ctx.lineTo(x-55,y+260);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(x+35,y+130);

ctx.lineTo(x+55,y+260);

ctx.stroke();

}

</script>

</body>
</html>
