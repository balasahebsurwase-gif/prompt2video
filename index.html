<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt2Video</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
}

textarea {
  width: 100%;
  height: 120px;
  box-sizing: border-box;
  padding: 12px;
  font-size: 16px;
}

select, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  font-size: 16px;
}

button {
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #eee;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Prompt2Video</h1>

<p>Turn your idea into a video plan.</p>

<div class="card">

<b>Enter your video idea</b>

<textarea id="prompt"
placeholder="Create a 15-second Marathi advertisement for my shop"></textarea>

<select id="language">
<option>English</option>
<option>Marathi</option>
<option>Hindi</option>
</select>

<select id="duration">
<option>15 seconds</option>
<option>30 seconds</option>
<option>60 seconds</option>
</select>

<button onclick="generate()">GENERATE</button>

<div id="result"></div>

</div>

</div>

<script>

function generate() {

var prompt = document.getElementById("prompt").value;
var language = document.getElementById("language").value;
var duration = document.getElementById("duration").value;

if (prompt == "") {
alert("Please enter your video idea.");
return;
}

var result =
"🎬 VIDEO PLAN\n\n" +
"Your idea:\n" + prompt + "\n\n" +
"Language: " + language + "\n" +
"Duration: " + duration + "\n\n" +
"🎥 SCENE 1\nOpening scene based on your idea.\n\n" +
"🎥 SCENE 2\nMain action or product scene.\n\n" +
"🎥 SCENE 3\nClosing scene and call to action.\n\n" +
"🎙 VOICE-OVER\nVoice-over in " + language + ".\n\n" +
"🎵 MUSIC\nBackground music matching the mood.\n\n" +
"📝 CAPTIONS\nCaptions for social media.\n\n" +
"📱 FORMAT\nVertical 9:16";

document.getElementById("result").innerText = result;
document.getElementById("result").style.display = "block";

}

</script>

</body>
</html>
